<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1F2D52">
<title>하운드 PDF</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="bar">
  <button id="bSide" class="tb" title="책갈피, 쪽 목록">목록</button>
  <button id="bOpen" class="tb">열기</button>
  <span id="title" class="title">하운드 PDF</span>
  <span class="grow"></span>
  <span class="tools">
    <button class="tb tool" data-tool="pen" title="펜">펜</button>
    <button class="tb tool" data-tool="hl" title="형광펜">형광펜</button>
    <button class="tb tool" data-tool="ul" title="밑줄(곧은 선)">밑줄</button>
    <button class="tb tool" data-tool="erase" title="지우개(이번에 그린 것)">지우개</button>
    <span class="colors" id="colors"></span>
    <button class="tb" id="bUndo" title="되돌리기">되돌리기</button>
  </span>
  <span class="grow"></span>
  <button class="tb" id="bView" title="쪽 보기, 넘기기">보기</button>
  <span class="pg"><input id="pgNo" inputmode="numeric" aria-label="쪽 번호"> / <span id="pgN">0</span></span>
  <button class="tb" id="bZoomOut" title="축소">−</button>
  <button class="tb" id="bZoomIn" title="확대">+</button>
  <button class="tb" id="bFit" title="높이 맞춤(쪽이 화면 높이에 꼭 맞게, 두 쪽이면 두 쪽이 함께)">높이 맞춤</button>
  <button class="tb solid" id="bSave">저장</button>
  <button class="tb" id="bSaveAs">다른 이름</button>
</header>
<div id="viewPop" class="pop" hidden>
    <span class="seg" title="쪽 보기"><button class="tb" id="bOne">한 쪽</button><button class="tb" id="bTwo">두 쪽</button></span>
    <button class="tb" id="bCover" title="두 쪽 보기에서 첫 쪽(표지)만 따로">첫 쪽 따로</button>
    <span class="seg" title="넘기기"><button class="tb" id="bPaged">쪽 넘김</button><button class="tb" id="bScroll">스크롤</button></span>
<div class="ver" id="verPop"></div>
</div>
<div id="main">
  <aside id="side">
    <div class="stabs"><button class="st on" data-s="marks">책갈피</button><button class="st" data-s="thumbs">쪽</button></div>
    <div id="marks" class="spane"></div>
    <div id="thumbs" class="spane" hidden></div>
  </aside>
  <section id="view" tabindex="0"><div id="pages"></div></section>
  <section id="peek" hidden>
    <div class="pk-bar"><b id="pkTitle" class="pk-title"></b><span id="pkPick" class="pk-pick"></span><span class="grow"></span>
      <span id="pkNo" class="pg"></span>
      <button class="tb" id="pkPrev" title="앞 쪽">앞 쪽</button><button class="tb" id="pkNext" title="다음 쪽">다음 쪽</button>
      <button class="tb" id="pkOut" title="축소">−</button><button class="tb" id="pkIn" title="확대">+</button>
      <button class="tb" id="pkGo" title="본문에서 이 쪽으로 가기">이 쪽으로</button><button class="tb solid" id="pkClose">닫기</button></div>
    <div id="pkBody"><canvas id="pkCanvas"></canvas></div>
  </section>
  <section id="home">
    <div class="homebox">
      <img src="icons/icon-192.png" alt="" width="72" height="72">
      <h1>하운드 PDF</h1>
      <button id="bOpen2" class="big">PDF 열기</button>
      <div class="ver" id="verHome"></div>
      <div class="recent"><div class="rh"><b>최근 연 파일</b><button id="bClear" class="link">목록 비우기</button></div><ul id="recent"></ul></div>
    </div>
  </section>
</div>
<input type="file" id="file" accept="application/pdf,.pdf" hidden>
<div id="toast" role="status"></div>
<div id="update" hidden><span>새 판이 있어요</span><button id="bReload" class="tb solid">다시 열기</button></div>
<script src="vendor/pdf.min.js"></script>
<script src="vendor/pdf-lib.min.js"></script>
<script src="evidence.js"></script>
<script src="app.js"></script>
</body>
</html>
